server.port=${PORT:8081}

# MCP protocol debug logging — shows incoming tool call requests
logging.level.io.modelcontextprotocol=DEBUG
logging.level.org.springframework.ai.mcp=DEBUG
spring.application.name=gemini-mcp-server

# MCP server identity
spring.ai.mcp.server.name=gemini-db-mcp-server
spring.ai.mcp.server.version=1.0.0

# Neon PostgreSQL — same env vars as gemini-chat
spring.datasource.url=jdbc:postgresql://${NEON_HOST}/${NEON_DB}?sslmode=require
spring.datasource.hikari.data-source-properties.channelBinding=disable
spring.datasource.username=${NEON_USER}
spring.datasource.password=${NEON_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=3
